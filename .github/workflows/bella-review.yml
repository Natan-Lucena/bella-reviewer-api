name: Bella Reviewer

# Segundo commit deste PR de teste — dispara o evento `synchronize` pra
# validar que um novo commitSha gera uma ReviewRun nova e independente,
# em vez de reaproveitar a execução do commit anterior.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bella-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: Natan-Lucena/bella-review-action@main
        with:
          bella-token: ${{ secrets.BELLA_TOKEN }}
          api-url: ${{ vars.BELLA_API_URL }}
