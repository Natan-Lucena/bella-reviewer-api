name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    strategy:
      matrix:
        # pnpm 11.x itself requires Node >= 22.13 (it uses node:sqlite
        # internally) — it fails at "pnpm install" under Node 20.x
        # regardless of what this project's own engines.node says, so 20.x
        # can't be in this matrix as long as we're on pnpm 11.
        node-version: [22.x, 24.x]

    # Dummy values, not real secrets: config.ts requires these to be present
    # and MASTER_KEY must decode to exactly 32 bytes, but nothing in this
    # workflow ever connects to a real database or encrypts real data, so a
    # fixed placeholder here is fine and doesn't need to live in repo secrets.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      MASTER_KEY: "KUiuiTau2tuHp71cuLtRoYhjK4d+osLi7Xsqjbc/tz0="
      SESSION_SECRET: "ci-dummy-session-secret"
      QSTASH_TOKEN: "ci-dummy-qstash-token"

    steps:
      - uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test:coverage

      - name: Publish coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: "./coverage/coverage-summary.json"
