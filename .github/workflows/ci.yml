name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    # Dummy values, not real secrets: config.ts requires these to be present
    # and MASTER_KEY must decode to exactly 32 bytes (see
    # backend-prds/01-shared-cifra-hash-credenciais.md), but nothing in this
    # workflow ever connects to a real database or encrypts real data, so a
    # fixed placeholder here is fine and doesn't need to live in repo secrets.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      MASTER_KEY: "KUiuiTau2tuHp71cuLtRoYhjK4d+osLi7Xsqjbc/tz0="
      SESSION_SECRET: "ci-dummy-session-secret"

    steps:
      - uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test:coverage

      - name: Publish coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: "./coverage/coverage-summary.json"
