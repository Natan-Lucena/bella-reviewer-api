# Brings up only the database for local development. The API image (its own
# Dockerfile) comes in a future step, once the backend has enough use cases
# to be worth packaging (the real deploy target is Vercel, not this
# docker-compose — this is just for the local Postgres that Neon replaces
# in production).
services:
  db:
    image: postgres:16-alpine
    container_name: bella-reviewer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bella
      POSTGRES_PASSWORD: bella
      POSTGRES_DB: bella_reviewer
    ports:
      - "5432:5432"
    volumes:
      - bella-reviewer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bella -d bella_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bella-reviewer-db-data:
    name: bella-reviewer-db-data
